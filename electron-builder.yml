# Packages build/app (assembled by scripts/pack.ts) into a per-user Windows installer, a
# macOS disk image and zip for the architecture of the Mac it is built on, or a Linux AppImage and deb.
appId: ai.pal.coopanion
productName: Coopanion
copyright: Copyright © 2026 Pal-AI-Lab
electronVersion: 44.4.4
directories:
  app: build/app
  output: dist
# the Core child runs TypeScript sources through tsx and spawns esbuild, koffi, sherpa-onnx and pnpm: keep files unpacked
asar: false
npmRebuild: false
nodeGypRebuild: false
files:
  - "**/*"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: app/icons/icon.ico
# Asks where to install. Every file the app writes stays under that directory (data in data\),
# so the start-menu entry, which Windows keeps under AppData, is not created.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: installer/nsis.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: false
  shortcutName: Coopanion
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Coopanion-Setup-${version}.exe
# No Developer ID: the app is signed ad hoc ("-"), which Apple silicon needs to launch it at all;
# the first open goes through Privacy & Security → Open Anyway (see the README). It lives in the
# menu bar (LSUIElement), not the Dock; its data is in ~/Library/Application Support/Coopanion.
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.lifestyle
  icon: app/icons/icon.png
  identity: "-"
  artifactName: Coopanion-${version}-mac-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Coo 用麦克风听你说话,语音在本机识别,录音不会上传。
    NSAppleEventsUsageDescription: 操作电脑时,Coo 用它把你指定的应用切到前面。
dmg:
  writeUpdateInfo: false
# x64 only. Data goes to ~/.config/Coopanion. The app runs on X11 (XWayland under Wayland, see app/main.cjs);
# the tray needs a StatusNotifier host (most desktops have one; without it settings open from the pet's menu).
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: app/icons/icon.png
  category: Utility
  executableName: coopanion
  synopsis: 桌面上的 AI 陪伴桌宠
  maintainer: Pal-AI-Lab <phantivia@gmail.com>
  # ${arch} would read x86_64 for the AppImage and amd64 for the deb
  artifactName: Coopanion-${version}-linux-x64.${ext}
  desktop:
    entry:
      StartupWMClass: Coopanion
deb:
  # libxtst6/libxss1: the computer-use World's input and idle time; xdotool types text; zenity asks before acting
  depends: [libgtk-3-0 | libgtk-3-0t64, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0 | libatspi2.0-0t64, libuuid1, libsecret-1-0, libasound2 | libasound2t64, xdotool, zenity]
